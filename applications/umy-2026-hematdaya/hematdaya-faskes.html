<title>HematDaya Faskes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tata letak: satu kolom aplikasi seluler di atas latar abu terang. Kartu putih berbayang lembut, satu aksen biru, Inter.
   Mengikuti design system "Nama Brand": token di bawah memakai nama yang sama. chart-1 sampai chart-5 adalah tambahan di luar sistem
   (grafik bertumpuk membutuhkan lima seri: biru muda, aksen, biru tua, abu, biru pucat). */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --text:#1d1d1f; --text-muted:#6e6e73;
  --accent:#0071e3; --on-accent:#ffffff; --accent-text:#0066cc; --accent-bg:#e5f0fc;
  --border:#d2d2d7; --border-strong:#86868b; --focus-ring:#0071e3;
  --success:#17713f; --success-bg:#e4f4ea; --warning:#8a5a00; --warning-bg:#fdf0d5; --danger:#c42b2b; --danger-bg:#fde9e9;
  --chart-1:#7ab8f5; --chart-2:#0071e3; --chart-3:#0a3f84; --chart-4:#86868b; --chart-5:#b9d6f5; --scrim:rgba(0,0,0,.4);
  --space-card:24px; --space-gap:18px; --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px;
  --radius-button:6px; --radius-card:10px; --radius-pill:999px;
  --shadow-card:0 2px 14px rgba(0,0,0,.07); --shadow-button:none;
  --motion-duration:.22s; --motion-ease:cubic-bezier(.2,.7,.2,1);
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --c0:var(--chart-1); --c1:var(--chart-2); --c2:var(--chart-3); --c3:var(--chart-4); --c4:var(--chart-5);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#1a1e24; --text:#eceff3; --text-muted:#98a1ae; --accent:#0071e3; --on-accent:#ffffff; --accent-text:#4aa3ff; --accent-bg:#14263d;
  --border:#2a3038; --border-strong:#6f7785; --focus-ring:#4aa3ff; --success:#5fd38d; --success-bg:#16301f; --warning:#f2b84b; --warning-bg:#33290f; --danger:#ff8080; --danger-bg:#3a1a1a;
  --chart-1:#9fcbff; --chart-2:#0071e3; --chart-3:#cfe3fb; --chart-4:#6f7785; --chart-5:#4aa3ff; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#1a1e24; --text:#eceff3; --text-muted:#98a1ae; --accent:#0071e3; --on-accent:#ffffff; --accent-text:#4aa3ff; --accent-bg:#14263d;
  --border:#2a3038; --border-strong:#6f7785; --focus-ring:#4aa3ff; --success:#5fd38d; --success-bg:#16301f; --warning:#f2b84b; --warning-bg:#33290f; --danger:#ff8080; --danger-bg:#3a1a1a;
  --chart-1:#9fcbff; --chart-2:#0071e3; --chart-3:#cfe3fb; --chart-4:#6f7785; --chart-5:#4aa3ff; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:16px;line-height:26px;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
#app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
header.top{flex:none;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);padding:0 max(16px,env(safe-area-inset-left,0px))}
.toprow{display:flex;align-items:center;gap:var(--space-2);min-height:60px}
.brand{margin-right:auto;font:600 18px/24px var(--font-sans);letter-spacing:-.01em;color:var(--text)}
.iconbtn{width:44px;height:44px;border-radius:var(--radius-button);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:grid;place-items:center;flex:none;transition:transform var(--motion-duration) var(--motion-ease)}
.iconbtn:hover{transform:translateY(-2px)}
.iconbtn:focus-visible,.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
main{flex:1;min-height:0;overflow-y:auto;padding:var(--space-5) max(16px,env(safe-area-inset-right,0px)) var(--space-6) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--space-gap);scroll-behavior:smooth}
.pgt{font:700 32px/38px var(--font-sans);letter-spacing:-.03em;color:var(--text);text-wrap:balance;overflow-wrap:anywhere}
.pgt.sm{font:700 24px/30px var(--font-sans);letter-spacing:-.02em}
.modes{display:flex;gap:var(--space-2);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--surface);color:var(--text-muted);font:600 12px/16px var(--font-sans);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.info{background:var(--accent-bg);color:var(--accent-text)}
.chip.ok{background:var(--success-bg);color:var(--success)}
.chip.warn{background:var(--warning-bg);color:var(--warning)}
.chip.bad{background:var(--danger-bg);color:var(--danger)}
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--border);padding:6px 0 max(10px,env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:2px;min-height:56px;padding:4px 0;font:500 11px/14px var(--font-sans);color:var(--text-muted);position:relative}
.tab[aria-selected="true"]{color:var(--accent-text)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:600 11px/18px var(--font-sans);text-align:center;padding:0 5px}
.card{background:var(--surface);color:var(--text);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:var(--space-card);display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.card h2{font:700 24px/30px var(--font-sans);letter-spacing:-.02em}
.card h3{font:600 18px/24px var(--font-sans);letter-spacing:-.01em}
h2.sec{padding:var(--space-2) 0 0;font:600 18px/24px var(--font-sans);letter-spacing:-.01em;color:var(--text)}
.seg{display:flex;gap:var(--space-5);border-bottom:1px solid var(--border)}
.seg button{border:0;background:none;padding:10px 0;min-height:44px;margin-bottom:-1px;border-bottom:2px solid transparent;font:500 14px/20px var(--font-sans);color:var(--text-muted);transition:color var(--motion-duration) var(--motion-ease)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.big{font:700 32px/38px var(--font-sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font:500 14px/20px var(--font-sans);letter-spacing:0;color:var(--text-muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-width:0}
.sub{color:var(--text-muted);font:400 14px/22px var(--font-sans)}
.k{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 20px;border:1px solid transparent;border-radius:var(--radius-button);background:var(--accent);color:var(--on-accent);font:600 15px/20px var(--font-sans);letter-spacing:-.01em;text-align:center;box-shadow:var(--shadow-button);transition:transform var(--motion-duration) var(--motion-ease),background-color var(--motion-duration) var(--motion-ease),filter var(--motion-duration) var(--motion-ease)}
.btn:hover{transform:translateY(-2px);filter:brightness(.94)}
.btn:active{transform:none;filter:brightness(.94)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn.ghost:hover{filter:none}
.btn.plain{background:transparent;color:var(--accent-text)}
.btn.plain:hover{background:var(--accent-bg);filter:none}
.btn.small{padding:7px 14px;font:600 13px/18px var(--font-sans)}
.btnrow{display:flex;gap:var(--space-3);flex-wrap:wrap}
.banner{border-radius:var(--radius-card);padding:var(--space-3) var(--space-4);font:400 14px/22px var(--font-sans);display:flex;gap:10px;align-items:flex-start;background:var(--warning-bg);color:var(--warning)}
.banner.bad{background:var(--danger-bg);color:var(--danger)}
.banner.info{background:var(--accent-bg);color:var(--text)}
.banner b{font-weight:700}
.dev,.ins{display:flex;flex-direction:column;gap:var(--space-2);text-align:left;width:100%;border:0;background:var(--surface);color:var(--text);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:var(--space-4) var(--space-card);transition:transform var(--motion-duration) var(--motion-ease)}
.dev:hover,.ins:hover{transform:translateY(-2px)}
.dev .nm{font:600 16px/22px var(--font-sans);overflow-wrap:anywhere}
.ins .t{font:600 16px/24px var(--font-sans);letter-spacing:-.01em}
.ins .sub:last-child{color:var(--accent-text);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12px/16px var(--font-sans);color:var(--text-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text-muted);font-size:12px;font-family:var(--font-sans)}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart rect{stroke:var(--surface);stroke-width:1}
.chart .s0{fill:var(--c0)}.chart .s1{fill:var(--c1)}.chart .s2{fill:var(--c2)}.chart .s3{fill:var(--c3)}.chart .s4{fill:var(--c4)}
.chart .gap{fill:none;stroke:var(--text-muted);stroke-width:1.2;stroke-dasharray:2 2}
table.ev{width:100%;border-collapse:collapse;font:400 14px/22px var(--font-sans)}
table.ev th,table.ev td{padding:10px 0;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.ev tr:last-child th,table.ev tr:last-child td{border-bottom:0}
table.ev td:last-child,table.ev th:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.ev th{font-weight:500;color:var(--text-muted)}
.empty{text-align:center;padding:var(--space-6) var(--space-2);display:flex;flex-direction:column;gap:var(--space-4);align-items:center}
.empty .ill{width:84px;height:84px;border-radius:var(--radius-card);background:var(--accent-bg);display:grid;place-items:center}
.empty h2{font:700 24px/30px var(--font-sans);letter-spacing:-.02em}
.empty p{color:var(--text-muted);max-width:32ch}
.dim{opacity:.55}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:88%;overflow-y:auto;border-radius:var(--radius-card) var(--radius-card) 0 0;padding:var(--space-card) max(var(--space-card),env(safe-area-inset-left,0px)) calc(var(--space-card) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--space-4)}
.sheet h2{font:700 24px/30px var(--font-sans);letter-spacing:-.02em}
.grab{display:none}
.field{display:flex;flex-direction:column;gap:var(--space-2)}
.field label,.field .lab{font:600 14px/20px var(--font-sans)}
.field input[type=number],.field select,.field textarea{min-height:48px;border:1px solid var(--border-strong);border-radius:var(--radius-button);padding:11px 14px;background:var(--surface);color:var(--text);width:100%;font:400 16px/22px var(--font-sans)}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{border-color:var(--focus-ring)}
.field textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical}
.hint{font:400 13px/18px var(--font-sans);color:var(--text-muted)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.days{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.days label{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-button);font:600 14px/20px var(--font-sans);background:var(--surface);color:var(--text);cursor:pointer;transition:background-color var(--motion-duration) var(--motion-ease)}
.days input{position:absolute;opacity:0;width:1px;height:1px}
.days label:has(input:checked){background:var(--accent-bg);border-color:var(--accent-text);color:var(--accent-text)}
.days label:has(input:focus-visible){outline:2px solid var(--focus-ring);outline-offset:2px}
.dvr{display:flex;flex-direction:column;gap:var(--space-2);background:var(--bg);border-radius:var(--radius-button);padding:var(--space-3) var(--space-4)}
.dvr .nm{font:600 16px/22px var(--font-sans);overflow-wrap:anywhere}
.dvr select{min-height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-button);padding:8px 12px;background:var(--surface);color:var(--text);width:100%;font:400 16px/22px var(--font-sans)}
.dvr label.ck{display:flex;align-items:center;gap:10px;min-height:44px;font:600 14px/20px var(--font-sans)}
.dvr input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
pre.code{margin:0;background:var(--bg);border-radius:var(--radius-button);padding:var(--space-3);font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;color:var(--text)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:20;background:var(--text);color:var(--bg);border-radius:var(--radius-button);padding:var(--space-3) var(--space-4);font:500 14px/20px var(--font-sans);box-shadow:var(--shadow-card)}
.link{background:none;border:0;color:var(--accent-text);font:600 14px/20px var(--font-sans);text-decoration:underline;padding:12px 4px;min-height:44px;text-align:left}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.scen button{min-height:56px;text-align:left;padding:8px 12px;border-radius:var(--radius-button);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:600 14px/20px var(--font-sans)}
.scen button[aria-pressed="true"]{border-color:var(--accent-text);background:var(--accent-bg);color:var(--accent-text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .btn,.iconbtn,.dev,.ins,.seg button,.days label{transition:none}
  .btn:hover,.iconbtn:hover,.dev:hover,.ins:hover{transform:none}
  main{scroll-behavior:auto}
}
</style>

<div id="app" role="application" aria-label="HematDaya Faskes"></div>

<script>
(function(){
'use strict';
/* ====== util ====== */
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
var DAYF=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var H=3600e3, DAY=86400e3;
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nf(n,d){return Number(n).toLocaleString('id-ID',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function rp(n){n=Math.round(n);return n>=1e6?'Rp '+nf(n/1e6,1)+' jt':'Rp '+nf(n)}
function kwh(wh,d){return nf(wh/1000,d==null?1:d)+' kWh'}
function p2(n){return (n<10?'0':'')+n}
function dtext(t){var d=new Date(t);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()}
function ttext(t){var d=new Date(t);return p2(d.getUTCHours())+'.'+p2(d.getUTCMinutes())}
function dow(t){return new Date(t).getUTCDay()}
function hr(t){return new Date(t).getUTCHours()}
function dayStart(t){return Math.floor(t/DAY)*DAY}
function monStart(t){var d=dow(t);return dayStart(t)-((d+6)%7)*DAY}
function median(a){if(!a.length)return 0;var s=a.slice().sort(function(x,y){return x-y}),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function ls(op,k,v){try{if(op==='g')return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ====== data contoh (deterministik) ====== */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var SAMPLE_DV={'AC Poli Rawat Jalan':{lay:'poli',krit:false},'Chiller Rawat Inap':{lay:'24',krit:false},'Autoklaf CSSD':{lay:'poli',krit:false},'Lemari Pendingin Vaksin dan Obat':{lay:'24',krit:true},'Pompa Air dan Penerangan':{lay:'24',krit:false}};
function sampleRows(){
  var r=rng(20261019),rows=[];
  var t0=Date.UTC(2026,8,21,0,0), tEnd=Date.UTC(2026,9,17,23,0);
  var acNight=Date.UTC(2026,9,12,0,0), autoLate=Date.UTC(2026,9,14,0,0), ramp=Date.UTC(2026,9,6,0,0);
  for(var t=t0;t<=tEnd;t+=H){
    var d=dow(t),h=hr(t),work=d>=1&&d<=6;
    var n=function(a){return (r()-.5)*2*a};
    var ac=.12+n(.02), chil=(h>=8&&h<20?9:6)+n(.5), aut=.08+n(.02), fr=.16+n(.012), pmp=(h>=6&&h<21?3.5:1.6)+n(.25);
    if(work&&h>=7&&h<16) ac=6+n(.6);
    if(work&&h>=7&&h<15) aut=(h%2===0?2.6:1.4)+n(.3);
    if(t>=acNight&&(h>=19||h<5)) ac+=1+n(.15);
    if(t>=autoLate&&t<autoLate+DAY&&h>=17&&h<21) aut+=2.4+n(.3);
    if(t>=ramp) fr+=.004*((t-ramp)/DAY);
    rows.push({t:t,d:'AC Poli Rawat Jalan',wh:Math.round(ac*1000)});
    rows.push({t:t,d:'Chiller Rawat Inap',wh:Math.round(chil*1000)});
    rows.push({t:t,d:'Autoklaf CSSD',wh:Math.round(aut*1000)});
    rows.push({t:t,d:'Lemari Pendingin Vaksin dan Obat',wh:Math.round(fr*1000)});
    rows.push({t:t,d:'Pompa Air dan Penerangan',wh:Math.round(pmp*1000)});
  }
  return rows;
}

/* ====== impor CSV ====== */
var COLS={t:['timestamp','waktu','tanggal','datetime','time'],d:['perangkat','mesin','device','nama','alat'],wh:['energi_wh','wh','energi'],w:['daya_w','watt','daya','power_w']};
function findCol(h,keys){for(var i=0;i<h.length;i++)if(keys.indexOf(h[i])>-1)return i;return -1}
function parseTime(s){
  var m=/^\s*(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2})[:.](\d{2})(?::\d{2})?)?(?:Z|[+-]\d{2}:?\d{2})?\s*$/.exec(s);
  if(!m)return null;
  var mo=+m[2],dd=+m[3],hh=+(m[4]||0),mi=+(m[5]||0);
  if(mo<1||mo>12||dd<1||dd>31||hh>23||mi>59)return null;
  return Date.UTC(+m[1],mo-1,dd,hh,mi);
}
function parseCSV(text){
  var lines=String(text).replace(/\r/g,'').split('\n').filter(function(l){return l.trim()});
  if(lines.length<2)return{error:'File kosong atau hanya berisi judul kolom. Tambahkan baris data di bawah judul.'};
  var first=lines[0],del=(first.split(';').length>first.split(',').length)?';':',';
  var head=first.split(del).map(function(x){return x.trim().toLowerCase().replace(/^"|"$/g,'')});
  var ci={t:findCol(head,COLS.t),d:findCol(head,COLS.d),wh:findCol(head,COLS.wh),w:findCol(head,COLS.w)};
  if(ci.t<0||ci.d<0||(ci.wh<0&&ci.w<0))return{error:'Judul kolom belum dikenali. Gunakan: timestamp, perangkat, energi_wh (atau daya_w). Contoh: timestamp,perangkat,energi_wh'};
  if(lines.length-1>150000)return{error:'Data terlalu besar untuk prototipe ini (maksimum 150.000 baris). Potong data menjadi periode yang lebih pendek.'};
  var rows=[],bad=0,useW=ci.wh<0;
  for(var i=1;i<lines.length;i++){
    var c=lines[i].split(del),t=parseTime((c[ci.t]||'').replace(/"/g,'')),name=(c[ci.d]||'').trim().replace(/^"|"$/g,'');
    var v=parseFloat(String(c[useW?ci.w:ci.wh]||'').replace(/"/g,'').replace(',','.'));
    if(t==null||!name||!isFinite(v)||v<0){bad++;continue}
    rows.push({t:t,d:name.slice(0,60),wh:v});
  }
  if(!rows.length)return{error:'Tidak ada baris yang valid. Periksa format waktu (contoh 2026-10-12 08:00) dan angka tidak boleh negatif.'};
  if(bad/(rows.length+bad)>.2)return{error:'Terlalu banyak baris tidak valid ('+bad+' dari '+(rows.length+bad)+'). Periksa format waktu dan angka.'};
  rows.sort(function(a,b){return a.t-b.t});
  if(useW){ // daya rata-rata (W) per interval -> Wh
    var gaps=[];for(var j=1;j<rows.length&&gaps.length<500;j++){var g=rows[j].t-rows[j-1].t;if(g>0)gaps.push(g)}
    var ih=median(gaps)/H||1;rows.forEach(function(x){x.wh=x.wh*ih});
  }
  var seen={},dup=0,out=[];
  rows.forEach(function(x){var k=x.d+'|'+x.t;if(seen[k]){dup++;return}seen[k]=1;out.push(x)});
  return{rows:out,bad:bad,dup:dup,useW:useW};
}

var KEY='hematdaya-faskes.v1';
var saved=ls('g',KEY)||{};
var S={
  tab:'beranda',screen:null,period:'minggu',sheet:null,toast:'',scen:'normal',nowOff:0,
  rows:[],source:'kosong',
  set:{start:7,end:16,days:[1,2,3,4,5,6],tariff:1500,area:2400,beds:30},
  dv:{},fb:{},imp:{text:'',error:'',info:''}
};
if(saved.set)for(var k in saved.set)S.set[k]=saved.set[k];
if(saved.fb)S.fb=saved.fb;
if(saved.dv)S.dv=saved.dv;
function persist(){ls('s',KEY,{set:S.set,fb:S.fb,dv:S.dv})}
// jenis perangkat: lay 'poli' (jam layanan) atau '24' (24 jam); krit = beban kritis (hanya dipantau)
function dvA(n){return S.dv[n]||{lay:'24',krit:false}}

/* ====== analisis ====== */
var D={};
function prep(){
  var rows=S.rows;D={rows:rows,devs:[],by:{},first:0,last:0,ih:H};
  if(!rows.length)return;
  rows.forEach(function(x){if(!D.by[x.d]){D.by[x.d]=[];D.devs.push(x.d)}D.by[x.d].push(x)});
  D.first=rows[0].t;D.last=rows[rows.length-1].t;
  var gaps=[];var a=D.by[D.devs[0]];for(var i=1;i<a.length&&gaps.length<500;i++){var g=a[i].t-a[i-1].t;if(g>0)gaps.push(g)}
  D.ih=median(gaps)||H;
  D.end=D.last+D.ih;
  D.today=[dayStart(D.last),D.end];
  var ws=monStart(D.last);D.week=[ws,D.end];
  D.nBase=0;for(var k=1;k<=3;k++){if(ws-k*7*DAY>=D.first)D.nBase=k;else break}
  D.span=(D.end-D.first)/DAY;
}
function isOp(t){return S.set.days.indexOf(dow(t))>-1&&hr(t)>=S.set.start&&hr(t)<S.set.end}
function agg(dev,from,to){
  var r={wh:0,off:0,op:0,cnt:0,exp:0},list=dev?[dev]:D.devs;
  list.forEach(function(n){
    var a=D.by[n]||[];
    for(var i=0;i<a.length;i++){var x=a[i];if(x.t<from||x.t>=to)continue;r.wh+=x.wh;r.cnt++;if(isOp(x.t))r.op+=x.wh;else r.off+=x.wh}
    var f=Math.max(from,D.first),e=Math.min(to,D.end);if(e>f)r.exp+=Math.ceil((e-f)/D.ih);
  });
  r.cov=r.exp?Math.min(1,r.cnt/r.exp):0;return r;
}
function cost(wh){var t=S.set.tariff;return(t===''||t==null||!(t>0))?null:wh/1000*t}
function workDays(from,to){var n=0;for(var t=dayStart(from);t<to;t+=DAY)if(S.set.days.indexOf(dow(t))>-1)n++;return n}
function intens(from,to){
  var a=S.set.area,b=S.set.beds,wh=agg(null,from,to).wh;
  var f=Math.max(from,D.first),e=Math.min(to,D.end),days=(e-f)/DAY;
  return{m2:a>0?wh/1000/a:null,bed:(b>0&&days>0)?wh/1000/(b*days):null,days:days};
}
function isStale(){return S.nowOff*H>2*D.ih}
function insights(){
  var out=[];if(!D.rows.length)return out;
  var wk=D.week,el=wk[1]-wk[0],tot=agg(null,wk[0],wk[1]);
  var base=function(dev,fn){var a=[];for(var k=1;k<=D.nBase;k++){var f=wk[0]-k*7*DAY;a.push(fn(agg(dev,f,f+el)))}return a};
  var learning=D.nBase<2;
  D.devs.forEach(function(dv){
    if(learning)return;
    var at=dvA(dv),cur=agg(dv,wk[0],wk[1]);
    if(at.lay==='poli'&&!at.krit){
      var b=base(dv,function(r){return r.off}),med=median(b),diff=cur.off-med;
      if(diff>=3000&&cur.off>=med*1.3){
        var ratio=med>0?cur.off/med:0;
        out.push({key:'luar-jam:'+dv,type:'luar-jam',dev:dv,pri:1,cur:cur,med:med,diff:diff,n:b.length,
          title:'Konsumsi '+dv+' di luar jam layanan '+(ratio>=3?'menjadi sekitar '+nf(ratio,1)+' kali minggu-minggu sebelumnya':'naik '+nf(med>0?diff/med*100:0)+'% dibanding minggu-minggu sebelumnya')});
      }
    }else{
      var b2=base(dv,function(r){return r.wh}),m2=median(b2),d2=cur.wh-m2;
      if(d2>=2000&&cur.wh>=m2*1.15){
        out.push({key:'naik:'+dv,type:'naik',dev:dv,krit:!!at.krit,pri:1,cur:cur,med:m2,diff:d2,n:b2.length,
          title:'Konsumsi '+dv+' naik '+nf(m2>0?d2/m2*100:0)+'% dibanding minggu-minggu sebelumnya'});
      }
    }
  });
  if(!learning){
    var bl=base(null,function(r){return r.wh}),m=median(bl);
    if(m>0&&tot.wh>0){
      var ch=(tot.wh-m)/m*100,per=S.set.area>0?' ('+nf(tot.wh/1000/S.set.area,2)+' kWh/m²)':'';
      out.push({key:'total',type:'total',pri:2,cur:tot.wh,med:m,ch:ch,n:bl.length,
        title:Math.abs(ch)<5?'Total energi minggu ini stabil dibanding minggu-minggu sebelumnya'+per:'Total energi minggu ini '+(ch>0?'naik ':'turun ')+nf(Math.abs(ch))+'% dibanding minggu-minggu sebelumnya'+per});
    }
  }
  var top=null;D.devs.forEach(function(dv){var w=agg(dv,wk[0],wk[1]).wh;if(!top||w>top.w)top={dv:dv,w:w}});
  if(top&&tot.wh>0)out.push({key:'kontribusi:'+top.dv,type:'kontribusi',dev:top.dv,pri:3,w:top.w,share:top.w/tot.wh*100,
    title:top.dv+' menyumbang '+nf(top.w/tot.wh*100)+'% energi minggu ini'});
  out.sort(function(a,b){return a.pri-b.pri||(b.diff||0)-(a.diff||0)});
  return out;
}
function fbOf(ins){var f=S.fb[ins.key];if(!f)return{st:'baru'};if(f.st==='ditunda'&&f.until&&Date.now()>f.until){return{st:'baru'}}return f}
function visibleIns(){return insights().filter(function(i){var s=fbOf(i).st;return s!=='disembunyikan'&&s!=='ditunda'})}

/* ====== grafik ====== */
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function chart(from,to,mode,dev){
  var devs=dev?[dev]:D.devs,B=[],i;
  if(mode==='hari'){var n=Math.min(24,Math.ceil((D.end-from)/H));for(i=0;i<24;i++)B.push({f:from+i*H,t:from+(i+1)*H,future:i>=n,lab:i%3===0?String(i):''})}
  else{for(i=0;i<7;i++)B.push({f:from+i*DAY,t:from+(i+1)*DAY,future:from+i*DAY>=D.end,lab:DAYS[dow(from+i*DAY)]})}
  var peak=0,gaps=0,partial=[];
  B.forEach(function(b){
    b.v=devs.map(function(d){var a=agg(d,b.f,b.t);return a.wh/1000});
    b.cnt=0;b.exp=0;devs.forEach(function(d){var a=agg(d,b.f,b.t);b.cnt+=a.cnt;b.exp+=a.exp});
    b.tot=b.v.reduce(function(x,y){return x+y},0);if(b.tot>peak){peak=b.tot;b.pk=1}
    if(!b.future&&b.exp&&b.cnt===0)b.gap=1,gaps++;
    else if(!b.future&&b.exp&&b.cnt<b.exp*.9)b.part=1,partial.push(b);
  });
  var mx=niceMax(peak),W=300,Hh=190,ml=34,mb=26,mt=18,pw=W-ml-4,ph=Hh-mb-mt,bw=pw/B.length;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Grafik energi">';
  [0,.5,1].forEach(function(f){var y=mt+ph-ph*f;s+='<line class="grid" x1="'+ml+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(ml-4)+'" y="'+(y+3)+'" text-anchor="end">'+nf(mx*f,mx<5?1:0)+'</text>'});
  s+='<text x="2" y="10">kWh</text>';
  B.forEach(function(b,k){
    var x=ml+k*bw+bw*.14,w=bw*.72,y0=mt+ph;
    if(b.gap){s+='<circle class="gap" cx="'+(x+w/2)+'" cy="'+(y0-4)+'" r="3.5"/>'}
    else if(!b.future){b.v.forEach(function(v,j){var h=v/mx*ph;if(h<=0)return;y0-=h;s+='<rect class="s'+(j%5)+'" x="'+x+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="2"/>'})}
    if(b.lab)s+='<text x="'+(x+w/2)+'" y="'+(Hh-8)+'" text-anchor="middle">'+b.lab+(b.part?'*':'')+'</text>';
  });
  s+='</svg>';
  var sum='';
  if(peak>0){var pk=B.filter(function(b){return b.pk})[0];sum='Puncak: '+(mode==='hari'?'pukul '+p2(hr(pk.f))+'.00':DAYF[dow(pk.f)])+' ('+nf(peak,1)+' kWh). '}
  if(mode==='minggu'&&B.some(function(b){return b.future}))sum+='Hari setelah '+DAYF[dow(D.end-1)]+' belum ada data. ';
  if(partial.length)sum+='Bertanda * berarti data hari itu belum lengkap. ';
  if(gaps)sum+='Lingkaran putus-putus berarti tidak ada data pada waktu itu, bukan nol. ';
  return{svg:s,sum:sum||'Belum ada energi tercatat pada periode ini.',legend:devs};
}
function legendHTML(devs){return '<div class="legend">'+devs.map(function(d,i){return '<span><i style="background:var(--c'+(i%5)+')"></i>'+esc(d)+'</span>'}).join('')+'</div>'}

function devCard(d,w,tot,i){

function setRows(rows,src){S.rows=rows;S.source=src;S.screen=null;S.tab='beranda';prep()}
function loadSample(){setRows(sampleRows(),'contoh');S.scen='normal';S.nowOff=0;S.set.tariff=1500;S.set.area=2400;S.set.beds=30;S.dv=JSON.parse(JSON.stringify(SAMPLE_DV));persist()}
function dropPartial(){
  var rows=sampleRows(),r=rng(7),cut=Date.UTC(2026,9,14,0,0);
  setRows(rows.filter(function(x){return !((x.d==='Pompa Air dan Penerangan'||x.d==='Autoklaf CSSD')&&x.t>=cut&&r()<.6)}),'contoh');
}
function scenario(k){
  S.scen=k;S.nowOff=0;if(k!=='tanpatarif')S.set.tariff=1500;
  if(k==='kosong'){setRows([],'kosong')}
  else if(k==='normal'){loadSample()}
  else if(k==='tanpatarif'){loadSample();S.set.tariff='';S.scen=k}
  else if(k==='terlambat'){loadSample();S.nowOff=3;S.scen=k}
  else if(k==='sebagian'){dropPartial()}
  else if(k==='rusak'){S.imp={text:'tanggal;perangkat;kwh\n12-10-2026;Autoklaf;abc\n',error:'',info:''};S.sheet='imp';var p=parseCSV(S.imp.text);S.imp.error=p.error||'';render();return}
  S.sheet=null;persist();render();
}
function readFile(file){
  var rd=new FileReader();
  rd.onload=function(){S.imp.text=String(rd.result||'').slice(0,6e6);S.imp.error='';S.imp.info='Berkas "'+file.name+'" dibaca. Tekan Analisis data.';render()};
  rd.onerror=function(){S.imp.error='Berkas tidak bisa dibaca. Coba pilih ulang atau tempel isinya langsung.';render()};
  rd.readAsText(file);
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||!$('#app').contains(el))return;
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
  if(a==='scrim'){if(e.target!==el)return;S.sheet=null;render();return}
  if(a==='tab'){S.tab=v;S.screen=null;render();return}
  if(a==='period'){S.period=v;render();return}
  if(a==='dev'){S.screen={type:'dev',id:v};render();return}
  if(a==='ins'){S.screen={type:'ins',id:v};render();return}
  if(a==='back'){S.screen=null;render();return}
  if(a==='sheet'){S.sheet=v;if(v==='imp'){S.imp.error='';S.imp.info=''}render();return}
  if(a==='close'){S.sheet=null;render();return}
  if(a==='more'){var m=$('#more');if(m)m.hidden=!m.hidden;return}
  if(a==='sample'){loadSample();S.sheet=null;persist();toast('Data contoh dimuat: 5 perangkat, 4 minggu.');return}
  if(a==='reset'){S.fb={};S.set={start:7,end:16,days:[1,2,3,4,5,6],tariff:1500,area:2400,beds:30};S.dv={};loadSample();S.sheet=null;persist();toast('Kembali ke kondisi awal.');return}
  if(a==='scen'){scenario(v);return}
  if(a==='restore'){Object.keys(S.fb).forEach(function(k){if(S.fb[k].st==='disembunyikan')delete S.fb[k]});persist();render();return}
  if(a==='fb'){var k=el.getAttribute('data-k');S.fb[k]={st:v,until:v==='ditunda'?Date.now()+864e5:0};persist();
    if(v==='disembunyikan'||v==='ditunda'){S.screen=null;S.tab='saran';toast(v==='ditunda'?'Saran ditunda sampai besok.':'Saran disembunyikan. Data tidak dihapus.')}else{toast('Terima kasih, umpan balik tersimpan.')}return}
  if(a==='copyex'){var ok=function(){toast('Contoh disalin.')},no=function(){var pre=$('#csvex');if(pre){var r=document.createRange();r.selectNodeContents(pre);var s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Salin manual: teks contoh sudah dipilih.')};
    try{navigator.clipboard.writeText(CSVEX).then(ok,no)}catch(x){no()}return}
  if(a==='runimp'){
    var ta=$('#f-csv');if(ta)S.imp.text=ta.value;
    var p=parseCSV(S.imp.text);
    if(p.error){S.imp.error=p.error;S.imp.info='';render();return}
    S.imp.error='';
    setRows(p.rows,'impor');S.sheet=null;S.nowOff=0;S.scen='normal';
    var devs={};p.rows.forEach(function(x){devs[x.d]=1});
    toast(nf(p.rows.length)+' baris dari '+Object.keys(devs).length+' perangkat diimpor.'+(p.bad?' '+p.bad+' baris dilewati.':'')+(p.dup?' '+p.dup+' baris ganda diabaikan.':''));
    return;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;if(!el.getAttribute)return;
  if(el.id==='f-file'&&el.files&&el.files[0]){readFile(el.files[0]);return}
  var k=el.getAttribute('data-set');if(!k)return;
  if(k==='start'||k==='end'){S.set[k]=+el.value;if(S.set.end<=S.set.start){S.set.end=Math.min(24,S.set.start+1);var se=$('#f-end');if(se)se.value=S.set.end}}
  else if(k==='dlay'||k==='dkrit'){var dn=el.getAttribute('data-dev'),at=S.dv[dn]=S.dv[dn]||{lay:'24',krit:false};if(k==='dlay')at.lay=el.value;else at.krit=el.checked}
  else if(k==='day'){var d=+el.value,i=S.set.days.indexOf(d);if(el.checked&&i<0)S.set.days.push(d);if(!el.checked&&i>-1)S.set.days.splice(i,1)}
  else{S.set[k]=el.value===''?'':Math.max(0,+el.value)}
  persist();
  // render ulang konten utama saja agar fokus di lembar pengaturan tidak hilang
  prep();var sheet=$('.scrim');var app=$('#app');var m=$('#main');
  var body=bodyHTML();
  if(m)m.innerHTML=body;
  var hd=$('header.top');if(hd)hd.innerHTML=header();
  var tb=$('nav.tabs');if(tb)tb.innerHTML=tabsHTML();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='f-csv')S.imp.text=e.target.value});

/* ====== mulai ====== */
loadSample();
render();
window.__hd={S:S,agg:function(){return D},insights:insights,intens:intens,dvA:dvA,parseCSV:parseCSV,render:render,scenario:scenario};
})();
</script>
