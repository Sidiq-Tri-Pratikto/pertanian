# Dedicated pilot broker. Keep this listener on the private lab network.
listener 8883
protocol mqtt
tls_version tlsv1.2
certfile /mosquitto/config/tls/broker.pem
keyfile /mosquitto/config/tls/broker.key

allow_anonymous false
password_file /mosquitto/config/pilot.passwd
acl_file /mosquitto/config/pilot.acl
use_username_as_clientid true

max_qos 1
max_packet_size 4096
persistence false
log_dest stderr
