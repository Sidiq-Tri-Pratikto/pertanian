# This project sits inside the pertanian repository. Hooks stay away from its other projects.
files: ^applications/generic/hematdaya/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
        always_run: false
      - id: check-ast
      - id: trailing-whitespace
        exclude: \.generated\.ts$
      - id: end-of-file-fixer
        exclude: \.generated\.ts$
      - id: check-added-large-files
        args: [--maxkb=750]
        exclude: package-lock\.json$
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep equal to the ruff version in uv.lock, or hooks and `make lint` disagree.
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
