appId: id.hematdaya.app
---
- launchApp:
    clearState: true
# The debug APK fetches its JavaScript from Metro, so the first screen can take minutes on a hosted emulator.
- extendedWaitUntil:
    visible: "Selamat datang"
    timeout: 180000
- scrollUntilVisible:
    element: "Lanjut tanpa data"
    direction: DOWN
- tapOn: "Lanjut tanpa data"
- extendedWaitUntil:
    visible: "Belum ada data energi"
    timeout: 60000
- assertVisible: "Beranda"
- assertVisible: "Perangkat"
- assertVisible: "Saran"
# The API is absent, so "Memeriksa layanan…" gives way to this notice once the request fails.
- scrollUntilVisible:
    element: "Layanan belum tersedia"
    direction: DOWN
    timeout: 60000
- takeScreenshot: beranda-service-unavailable
- tapOn: "Perangkat"
- extendedWaitUntil:
    visible: "Belum ada perangkat"
    timeout: 60000
- assertVisible: "Belum ada perangkat"
- takeScreenshot: perangkat-empty
# A device-local language choice works even while the API is unavailable.
- scrollUntilVisible:
    element: "Pengaturan"
    direction: DOWN
- tapOn: "Pengaturan"
- tapOn: "English"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Back"
- assertVisible: "No devices yet"
- takeScreenshot: devices-english
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "No energy data yet"
    timeout: 60000
- assertVisible: "Home"
- assertVisible: "Devices"
- assertVisible: "Insights"
- takeScreenshot: home-english-after-restart
