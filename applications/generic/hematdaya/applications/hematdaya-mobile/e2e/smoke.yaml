appId: id.hematdaya.app
---
- launchApp:
    clearState: true
# The debug APK fetches its JavaScript from Metro, so the first screen can take minutes on a hosted emulator.
- extendedWaitUntil:
    visible: "Selamat datang"
    timeout: 180000
- scrollUntilVisible:
    element: "Mulai"
    direction: DOWN
- tapOn: "Mulai"
# Mulai opens a temporary workspace through the API (012). The API is absent here, so the honest outcome is a
# failure with a retry on the welcome screen, never an invented workspace.
- scrollUntilVisible:
    element: "Belum berhasil"
    direction: DOWN
    timeout: 60000
- assertVisible: "Coba lagi"
- takeScreenshot: mulai-service-unreachable
# Without a workspace, Beranda is the S02 empty state, so the three tabs are still reachable by link.
- openLink: "hematdaya://beranda"
- extendedWaitUntil:
    visible: "Belum ada data energi"
    timeout: 60000
- assertVisible: "Beranda"
- assertVisible: "Perangkat"
- assertVisible: "Saran"
# The API is absent, so "Memeriksa layanan…" gives way to this notice once the request fails.
- scrollUntilVisible:
    element: "Layanan belum tersedia"
    direction: DOWN
    timeout: 60000
- takeScreenshot: beranda-service-unavailable
- tapOn: "Perangkat"
- extendedWaitUntil:
    visible: "Belum ada perangkat"
    timeout: 60000
- assertVisible: "Belum ada perangkat"
- takeScreenshot: perangkat-empty
