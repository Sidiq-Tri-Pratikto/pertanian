name: CI Mobile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/hematdaya-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: applications/hematdaya-mobile/.nvmrc
          cache: npm
          cache-dependency-path: applications/hematdaya-mobile/package-lock.json
      - run: npm ci
      - run: make check
      - run: make generate-api && git diff --exit-code src/api/schema.generated.ts
      - run: make doctor
      - run: make export
      - run: npm audit --omit=dev --audit-level=high
