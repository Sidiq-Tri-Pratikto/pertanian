[project]
name = "temuriset-api"
version = "0.1.0"
description = "Service for temuriset."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "boto3>=1.40,<2",
    "cryptography>=50,<51",
    "fastapi>=0.121",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Error-handling rules: bare except, blind ``except Exception``, ``except: pass`` / ``continue``, and re-raise
# without ``from``. A boundary that must catch everything says why: ``# noqa: BLE001 - <reason>``.
extend-select = ["E722", "BLE001", "S110", "S112", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--tb=short --import-mode=importlib"
markers = ["integration: needs a running Postgres"]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 80
show_missing = true
