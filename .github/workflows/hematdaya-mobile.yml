name: HematDaya Mobile

on:
  push:
    branches: [main]
    paths:
      - applications/generic/hematdaya/**
      - .github/workflows/hematdaya-mobile.yml
  pull_request:
    paths:
      - applications/generic/hematdaya/**
      - .github/workflows/hematdaya-mobile.yml

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/generic/hematdaya/applications/hematdaya-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: applications/generic/hematdaya/applications/hematdaya-mobile/.nvmrc
          cache: npm
          cache-dependency-path: applications/generic/hematdaya/applications/hematdaya-mobile/package-lock.json
      - run: npm ci
      - run: make check
      - run: make generate-api tokens && git diff --exit-code src/api/schema.generated.ts src/design/tokens.generated.ts
      - run: make doctor
      - run: make export
      - run: npm audit --omit=dev --audit-level=high
