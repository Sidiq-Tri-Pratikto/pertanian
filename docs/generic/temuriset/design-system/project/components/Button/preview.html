<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — preview</title></head>
<body>
<div id="root" class="tr-root tr-pad tr-stack"></div>
<script>
var TR = window.TR, h = React.createElement, F = TR.format, X = TR.demo.fixtures, useState = React.useState;
function S(label, child) { return h('div', { className: 'tr-stack' }, h('p', { className: 'tr-sys-type-support tr-muted' }, label), child); }
function Demo() {
  var busy = useState(false);
  function send() { busy[1](true); setTimeout(function () { busy[1](false); }, 1500); }
  return h(React.Fragment, null,
    S('Intent', h('div', { className: 'tr-row' },
      h(TR.Button, { intent: 'primary' }, 'Kirim pitching'),
      h(TR.Button, { intent: 'secondary' }, 'Lihat bukti'),
      h(TR.Button, { intent: 'danger' }, 'Tarik pitching'))),
    S('Busy (click it; repeat clicks are ignored)', h(TR.Button, { intent: 'primary', busy: busy[0], busyLabel: 'Mengirim\u2026', onClick: send }, 'Kirim pitching')),
    S('Disabled with reason', h(TR.Button, { intent: 'primary', disabledReason: 'Jawab semua pertanyaan wajib terlebih dahulu.' }, 'Kirim ulang pitching')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
