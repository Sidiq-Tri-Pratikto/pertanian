<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mulai</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/temuriset/tokens.css">
<link rel="stylesheet" href="ds/temuriset/components/bundle.css">
<script src="ds/temuriset/components/bundle.js"></script>
<script src="./domain.js"></script>
<script src="./views.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.Screen" dc-props="{{shell}}">
<section class="tr-panel tr-stack" aria-label="Pilih cara memakai TemuRiset">
<x-import component-from-global-scope="TR.ChoiceGroup" dc-props="{{persona}}"></x-import>
<x-import component-from-global-scope="TR.Select" dc-props="{{account}}"></x-import>
<x-import component-from-global-scope="TR.Select" dc-props="{{zone}}"></x-import>
<p class="tr-muted">{{noOrg}}</p>
<div class="tr-row">
<x-import component-from-global-scope="TR.Button" intent="primary" icon="arrow" on-click="{{enter}}">{{enterLabel}}</x-import>
</div>
</section>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  off = TemuRisetApp.attach(this, 'Start');
  componentWillUnmount() { this.off(); }
  renderVals() { return TemuRisetApp.vm.start(); }
}
</script>
</body>
</html>
