<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubah mandat</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/temuriset/tokens.css">
<link rel="stylesheet" href="ds/temuriset/components/bundle.css">
<script src="ds/temuriset/components/bundle.js"></script>
<script src="./domain.js"></script>
<script src="./views.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.Screen" dc-props="{{shell}}">
<div data-slot="context" style="display:contents"><x-import component-from-global-scope="TR.ContextSwitcher" dc-props="{{ctx}}"></x-import></div>
<div data-slot="back" style="display:contents"><sc-if value="{{allowed}}" hint-placeholder-val="{{true}}"><x-import component-from-global-scope="TR.Link" on-click="{{leave}}">Kembali ke profil</x-import></sc-if></div>
<sc-if value="{{denied}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.EmptyState" kind="denied">
<div data-slot="action" style="display:contents"><x-import component-from-global-scope="TR.Button" on-click="{{leave}}">Kembali</x-import></div>
</x-import>
</sc-if>
<sc-if value="{{allowed}}" hint-placeholder-val="{{true}}">
<div class="tr-section">
<sc-if value="{{showSummary}}" hint-placeholder-val="{{false}}"><x-import component-from-global-scope="TR.ErrorSummary" dc-props="{{summaryProps}}"></x-import></sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
<div class="tr-section">
<section class="tr-panel tr-stack" aria-label="Isi mandat">
<x-import component-from-global-scope="TR.TextField" dc-props="{{title}}"></x-import>
<x-import component-from-global-scope="TR.TextArea" dc-props="{{outcome}}"></x-import>
<div class="tr-grid">
<x-import component-from-global-scope="TR.TextArea" dc-props="{{included}}"></x-import>
<x-import component-from-global-scope="TR.TextArea" dc-props="{{excluded}}"></x-import>
</div>
<x-import component-from-global-scope="TR.TextField" dc-props="{{support}}"></x-import>
<x-import component-from-global-scope="TR.TextField" dc-props="{{timing}}"></x-import>
<x-import component-from-global-scope="TR.FinancialScope" dc-props="{{fin}}"></x-import>
</section>
<section class="tr-stack" aria-label="Syarat">
<h2 class="tr-sys-type-heading-sm">Syarat</h2>
<p class="tr-muted">Semua syarat terlihat oleh pengirim beserta alasannya. Tidak ada syarat tersembunyi.</p>
<sc-for list="{{reqs}}" as="r" hint-placeholder-count="3">
<div class="tr-panel tr-stack">
<ul><x-import component-from-global-scope="TR.RequirementRow" dc-props="{{r.row}}"></x-import></ul>
<x-import component-from-global-scope="TR.Select" dc-props="{{r.stage}}"></x-import>
<div class="tr-row"><x-import component-from-global-scope="TR.Button" on-click="{{r.remove}}">Hapus syarat</x-import></div>
</div>
</sc-for>
<div class="tr-panel tr-stack">
<x-import component-from-global-scope="TR.TextField" dc-props="{{newLabel}}"></x-import>
<div class="tr-grid">
<x-import component-from-global-scope="TR.Select" dc-props="{{newStage}}"></x-import>
<x-import component-from-global-scope="TR.Select" dc-props="{{newMode}}"></x-import>
</div>
<div class="tr-row"><x-import component-from-global-scope="TR.Button" on-click="{{addReq}}">Tambah syarat</x-import></div>
</div>
</section>
<div class="tr-row"><x-import component-from-global-scope="TR.Button" intent="primary" icon="arrow" on-click="{{toReview}}">Tinjau mandat</x-import></div>
</div>
</sc-if>
<sc-if value="{{reviewing}}" hint-placeholder-val="{{false}}">
<div class="tr-section">
<section class="tr-panel" aria-label="Ringkasan mandat"><x-import component-from-global-scope="TR.SummaryList" rows="{{reviewRows}}"></x-import></section>
<div class="tr-row">
<x-import component-from-global-scope="TR.Button" intent="primary" busy="{{saving}}" busy-label="Mengaktifkan…" on-click="{{save}}">{{saveLabel}}</x-import>
<x-import component-from-global-scope="TR.Button" on-click="{{toEdit}}">Kembali mengubah</x-import>
</div>
</div>
</sc-if>
</div>
</sc-if>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  off = TemuRisetApp.attach(this, 'Opportunity');
  componentWillUnmount() { this.off(); }
  renderVals() { return TemuRisetApp.vm.opportunity(); }
}
</script>
</body>
</html>
