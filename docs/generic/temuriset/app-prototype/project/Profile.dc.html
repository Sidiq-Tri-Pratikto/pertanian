<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil publik</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/temuriset/tokens.css">
<link rel="stylesheet" href="ds/temuriset/components/bundle.css">
<script src="ds/temuriset/components/bundle.js"></script>
<script src="./domain.js"></script>
<script src="./views.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.Screen" dc-props="{{shell}}">
<div data-slot="context" style="display:contents"><x-import component-from-global-scope="TR.ContextSwitcher" dc-props="{{ctx}}"></x-import></div>
<div data-slot="back" style="display:contents"><sc-if value="{{found}}" hint-placeholder-val="{{true}}"><x-import component-from-global-scope="TR.Link" on-click="{{back}}">Kembali</x-import></sc-if></div>
<sc-if value="{{missing}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.EmptyState" kind="denied">
<div data-slot="action" style="display:contents"><x-import component-from-global-scope="TR.Button" on-click="{{leave}}">Kembali</x-import></div>
</x-import>
</sc-if>
<sc-if value="{{found}}" hint-placeholder-val="{{true}}">
<div class="tr-section">
<section class="tr-panel" aria-label="Tentang"><p>{{bio}}</p></section>
<section class="tr-stack" aria-label="Inovasi terbit">
<h2 class="tr-sys-type-heading-sm">Inovasi terbit</h2>
<div class="tr-grid">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="1">
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.InventionCard" dc-props="{{c.card}}">
<div data-slot="action" style="display:contents"><x-import component-from-global-scope="TR.Button" on-click="{{c.open}}">Buka inovasi</x-import></div>
</x-import>
</sc-for>
</div>
</section>
<section class="tr-stack" aria-label="Kerja Sama">
<h2 class="tr-sys-type-heading-sm">Kerja Sama</h2>
<sc-if value="{{noRels}}" hint-placeholder-val="{{true}}"><p class="tr-muted">Belum ada Kerja Sama yang boleh ditampilkan.</p></sc-if>
<sc-for list="{{rels}}" as="r" hint-placeholder-count="0">
<article class="tr-panel tr-stack">
<x-import component-from-global-scope="TR.Status" dc-props="{{status}}"></x-import>
<x-import component-from-global-scope="TR.SummaryList" rows="{{r.rows}}"></x-import>
<p class="tr-muted tr-sys-type-support">{{r.note}}</p>
</article>
</sc-for>
</section>
</div>
</sc-if>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  off = TemuRisetApp.attach(this, 'Profile');
  componentWillUnmount() { this.off(); }
  renderVals() { return TemuRisetApp.vm.profile(); }
}
</script>
</body>
</html>
