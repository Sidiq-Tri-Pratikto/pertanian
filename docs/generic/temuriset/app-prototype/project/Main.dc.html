<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TemuRiset Prototype</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/temuriset/tokens.css">
<link rel="stylesheet" href="ds/temuriset/components/bundle.css">
<script src="ds/temuriset/components/bundle.js"></script>
<script src="./domain.js"></script>
<script src="./views.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--tr-sys-color-canvas)}
.tr-tabbar__item{overflow-wrap:normal;padding-left:0;padding-right:0}
</style>
</helmet>
<div style="background: var(--tr-sys-color-canvas);">
<dc-import name="DemoControls" hint-size="100%,64px"></dc-import>
<sc-if value="{{r.Start}}" hint-placeholder-val="{{true}}"><dc-import name="Start" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Home}}" hint-placeholder-val="{{false}}"><dc-import name="Home" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Discover}}" hint-placeholder-val="{{false}}"><dc-import name="Discover" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Inventions}}" hint-placeholder-val="{{false}}"><dc-import name="Inventions" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Invention}}" hint-placeholder-val="{{false}}"><dc-import name="Invention" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Editor}}" hint-placeholder-val="{{false}}"><dc-import name="Editor" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Support}}" hint-placeholder-val="{{false}}"><dc-import name="Support" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Funding}}" hint-placeholder-val="{{false}}"><dc-import name="Funding" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Partner}}" hint-placeholder-val="{{false}}"><dc-import name="Partner" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Opportunity}}" hint-placeholder-val="{{false}}"><dc-import name="Opportunity" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Matches}}" hint-placeholder-val="{{false}}"><dc-import name="Matches" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Preflight}}" hint-placeholder-val="{{false}}"><dc-import name="Preflight" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Pitches}}" hint-placeholder-val="{{false}}"><dc-import name="Pitches" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Workspace}}" hint-placeholder-val="{{false}}"><dc-import name="Workspace" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Partnership}}" hint-placeholder-val="{{false}}"><dc-import name="Partnership" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Profile}}" hint-placeholder-val="{{false}}"><dc-import name="Profile" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.ReviewQueue}}" hint-placeholder-val="{{false}}"><dc-import name="ReviewQueue" hint-size="100%,800px"></dc-import></sc-if>
<sc-if value="{{r.Settings}}" hint-placeholder-val="{{false}}"><dc-import name="Settings" hint-size="100%,800px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); TemuRisetApp.boot(); this.off = TemuRisetApp.attach(this, 'Main'); }
  componentWillUnmount() { this.off(); }
  renderVals() { return TemuRisetApp.vm.router(); }
}
</script>
</body>
</html>
