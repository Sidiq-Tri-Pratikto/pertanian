<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar pitching</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/temuriset/tokens.css">
<link rel="stylesheet" href="ds/temuriset/components/bundle.css">
<script src="ds/temuriset/components/bundle.js"></script>
<script src="./domain.js"></script>
<script src="./views.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.Screen" dc-props="{{shell}}">
<div data-slot="context" style="display:contents"><x-import component-from-global-scope="TR.ContextSwitcher" dc-props="{{ctx}}"></x-import></div>
<sc-if value="{{hasNotice}}" hint-placeholder-val="{{false}}"><x-import component-from-global-scope="TR.Status" dc-props="{{notice}}"></x-import></sc-if>
<section class="tr-panel" aria-label="Filter pitching">
<div class="tr-grid">
<x-import component-from-global-scope="TR.Select" dc-props="{{status}}"></x-import>
<x-import component-from-global-scope="TR.Select" dc-props="{{turn}}"></x-import>
</div>
</section>
<sc-if value="{{noneFiltered}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.EmptyState" kind="noMatches">
<div data-slot="action" style="display:contents"><x-import component-from-global-scope="TR.Button" on-click="{{clear}}">Hapus filter</x-import></div>
</x-import>
</sc-if>
<sc-if value="{{noneAtAll}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="TemuRisetApp.Slotted" of="TR.EmptyState" icon="inbox" title="Belum ada pitching di sini" body="Pitching muncul setelah dikirim dengan sengaja dari pemeriksaan sebelum kirim.">
<div data-slot="action" style="display:contents"><sc-if value="{{isInovator}}" hint-placeholder-val="{{true}}"><x-import component-from-global-scope="TR.Button" intent="primary" on-click="{{explore}}">Temukan Investor/Mitra</x-import></sc-if></div>
</x-import>
</sc-if>
<sc-if value="{{hasRows}}" hint-placeholder-val="{{true}}">
<section class="tr-stack" aria-label="Daftar pitching">
<sc-for list="{{rows}}" as="p" hint-placeholder-count="2">
<article class="tr-panel tr-stack">
<div class="tr-req__head"><h2 class="tr-sys-type-heading-sm">{{p.title}}</h2><x-import component-from-global-scope="TR.Status" dc-props="{{p.turn}}"></x-import></div>
<p class="tr-muted">{{p.peer}}</p>
<div class="tr-row"><span class="tr-tag tr-sys-type-support">{{p.purpose}}</span><x-import component-from-global-scope="TR.Status" dc-props="{{p.status}}"></x-import></div>
<sc-if value="{{p.hasInventions}}" hint-placeholder-val="{{false}}"><p class="tr-sys-type-support">{{p.inventions}}</p></sc-if>
<p class="tr-muted tr-sys-type-support">{{p.updated}}</p>
<div class="tr-row"><x-import component-from-global-scope="TR.Button" intent="secondary" on-click="{{p.open}}">Buka pitching</x-import></div>
</article>
</sc-for>
</section>
</sc-if>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  off = TemuRisetApp.attach(this, 'Pitches');
  componentWillUnmount() { this.off(); }
  renderVals() { return TemuRisetApp.vm.pitches(); }
}
</script>
</body>
</html>
