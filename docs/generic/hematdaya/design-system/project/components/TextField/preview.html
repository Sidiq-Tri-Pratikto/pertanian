<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TextField — preview</title></head>
<body>
<div id="root" class="hd-root hd-pad hd-stack"></div>
<script>
var HD = window.HD, h = React.createElement, F = HD.format, useState = React.useState;
function S(label, child) { return h('div', { className: 'hd-stack hd-stack--tight' }, h('p', { className: 'type-label hd-secondary' }, label), child); }
function Demo() {
  var name = useState('Pompa Air Area Produksi Belakang');
  var loc = useState('');
  var note = useState('Dipakai sore hari untuk mengisi tandon.');
  return h(React.Fragment, null,
    h(HD.TextField, { label: 'Nama perangkat', required: true, value: name[0], onChange: name[1], help: 'Nama yang mudah dikenali. Nama panjang tetap ditampilkan utuh.' }),
    h(HD.TextField, { label: 'Lokasi', optional: true, value: loc[0], onChange: loc[1], error: loc[0] ? null : null, help: 'Misalnya Dapur atau Area Produksi.' }),
    h(HD.TextField, { label: 'Nama lokasi', required: true, value: '', onChange: function () {}, error: 'Isi nama lokasi, misalnya Rumah Bandung.' }),
    h(HD.TextField, { label: 'ID sumber pengukuran', readOnly: true, value: 'SRC-0142', help: 'Dibuat sistem; dapat disalin, tidak dapat diubah.' }),
    h(HD.TextField, { label: 'Zona waktu lokasi', value: 'Asia/Jakarta', disabledReason: 'Zona waktu mengikuti lokasi dan diubah di Pengaturan lokasi.' }),
    h(HD.TextField, { label: 'Catatan', optional: true, multiline: true, value: note[0], onChange: note[1], draftNote: 'Draf tersimpan di perangkat ini — belum dikirim.' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
