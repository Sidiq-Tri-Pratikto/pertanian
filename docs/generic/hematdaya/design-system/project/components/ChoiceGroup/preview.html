<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChoiceGroup — preview</title></head>
<body>
<div id="root" class="hd-root hd-pad hd-stack"></div>
<script>
var HD = window.HD, h = React.createElement, F = HD.format, useState = React.useState;
function S(label, child) { return h('div', { className: 'hd-stack hd-stack--tight' }, h('p', { className: 'type-label hd-secondary' }, label), child); }
function Demo() {
  var ctx = useState('household'); var show = useState(['cost']); var tz = useState('Asia/Jakarta');
  return h(React.Fragment, null,
    h(HD.ChoiceGroup, { legend: 'Konteks penggunaan', help: 'Hanya mengubah contoh dan istilah. Izin dan perhitungan tetap sama.', value: ctx[0], onChange: ctx[1], options: [
      { value: 'household', label: 'Rumah tangga' }, { value: 'business', label: 'Usaha' }, { value: 'industry', label: 'Industri', description: 'Metrik output dan jadwal tetap opsional.' }] }),
    h(HD.ChoiceGroup, { type: 'checkbox', legend: 'Tampilkan di Beranda', optional: true, value: show[0], onChange: show[1], options: [
      { value: 'cost', label: 'Estimasi biaya energi terpantau' }, { value: 'quality', label: 'Kualitas data' },
      { value: 'output', label: 'Energi per output', disabledReason: 'Aktifkan metrik output di Pengaturan terlebih dahulu.' }] }),
    h(HD.ChoiceGroup, { type: 'select', legend: 'Zona waktu', value: tz[0], onChange: tz[1], options: [
      { value: 'Asia/Jakarta', label: 'Asia/Jakarta (WIB)' }, { value: 'Asia/Makassar', label: 'Asia/Makassar (WITA)' }, { value: 'Asia/Jayapura', label: 'Asia/Jayapura (WIT)' }] }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
