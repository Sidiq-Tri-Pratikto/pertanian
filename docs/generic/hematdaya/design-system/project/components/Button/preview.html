<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — preview</title></head>
<body>
<div id="root" class="hd-root hd-pad hd-stack"></div>
<script>
var HD = window.HD, h = React.createElement, F = HD.format, useState = React.useState;
function S(label, child) { return h('div', { className: 'hd-stack hd-stack--tight' }, h('p', { className: 'type-label hd-secondary' }, label), child); }
function Demo() {
  var busy = useState(false);
  function save() { busy[1](true); setTimeout(function () { busy[1](false); }, 1800); }
  return h(React.Fragment, null,
    S('Variants', h('div', { className: 'hd-row' },
      h(HD.Button, { variant: 'primary' }, 'Simpan tarif'),
      h(HD.Button, { variant: 'secondary' }, 'Lihat bukti'),
      h(HD.Button, { variant: 'text' }, 'Atur tarif'),
      h(HD.Button, { variant: 'destructive' }, 'Buang draf'))),
    S('Loading (click: duplicate clicks are ignored, no success is announced here)', h(HD.Button, { variant: 'primary', loading: busy[0], loadingLabel: 'Menyimpan…', onClick: save }, 'Simpan tarif')),
    S('Disabled with reason (still focusable, reason linked)', h(HD.Button, { variant: 'primary', disabledReason: 'Isi tarif terlebih dahulu untuk menyimpan.' }, 'Simpan tarif')),
    S('Long label wraps inside the 48px minimum', h('div', { style: { maxWidth: '16rem' } }, h(HD.Button, { variant: 'secondary', fullWidth: true }, 'Lihat periode data impor historis'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
