<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NumericField — preview</title></head>
<body>
<div id="root" class="hd-root hd-pad hd-stack"></div>
<script>
var HD = window.HD, h = React.createElement, F = HD.format, useState = React.useState;
function S(label, child) { return h('div', { className: 'hd-stack hd-stack--tight' }, h('p', { className: 'type-label hd-secondary' }, label), child); }
function Demo() {
  var a = useState(''); var b = useState('0'); var c = useState('1.500'); var d = useState('1.5'); var e = useState('-3');
  return h(React.Fragment, null,
    h(HD.NumericField, { label: 'Tarif listrik', optional: true, unit: 'Rp/kWh', value: a[0], onChange: a[1], help: 'Kosongkan bila belum tahu. Biaya akan tampil sebagai belum dihitung.' }),
    h(HD.NumericField, { label: 'Tarif listrik (nol tercatat)', unit: 'Rp/kWh', value: b[0], onChange: b[1] }),
    h(HD.NumericField, { label: 'Tarif listrik (titik ribuan)', unit: 'Rp/kWh', value: c[0], onChange: c[1], note: 'Terbaca: ' + (F.parseDecimal(c[0]).valid && !F.parseDecimal(c[0]).empty ? F.number(F.parseDecimal(c[0]).value) + ' Rp/kWh' : '—') }),
    h(HD.NumericField, { label: 'Daya terpasang', unit: 'kW', value: d[0], onChange: d[1], showErrors: true }),
    h(HD.NumericField, { label: 'Output produksi', unit: 'unit', value: e[0], onChange: e[1], showErrors: true }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
