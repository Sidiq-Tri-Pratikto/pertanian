<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DataQuality — preview</title></head>
<body>
<div id="root" class="hd-root hd-pad hd-stack"></div>
<script>
var HD = window.HD, h = React.createElement, F = HD.format, useState = React.useState;
function S(label, child) { return h('div', { className: 'hd-stack hd-stack--tight' }, h('p', { className: 'type-label hd-secondary' }, label), child); }
function Demo() {
  return h(React.Fragment, null,
    S('Partial + stale live source', h('div', { className: 'hd-group' }, h(HD.DataQuality, { completeness: 0.5, gaps: '06.00–18.00', freshness: { state: 'stale', lastMeasurement: '25 Oktober 2026 17.58' }, source: 'live', onCheckSource: function () {} }))),
    S('Historical import + client offline', h('div', { className: 'hd-group' }, h(HD.DataQuality, { completeness: 1, freshness: { state: 'historical', importRange: F.dateRange('2026-10-19', '2026-10-25') }, client: 'offline', cachedAge: '2 jam lalu', source: 'import', onViewPeriod: function () {} }))),
    S('Complete demo week', h('div', { className: 'hd-group' }, h(HD.DataQuality, { completeness: 0.92, gaps: '21 Oktober 2026 00.00–13.26', source: 'demo' }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
