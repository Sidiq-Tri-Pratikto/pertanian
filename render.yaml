# Render Blueprint for TemuRiset's API and worker.
# Put this file at the root of the pertanian repository. The web app runs on Vercel.
# Secrets are marked `sync: false`: Render asks for them when you create the Blueprint.
services:
  - type: web
    name: temuriset-api
    runtime: docker
    plan: free # Free sleeps after 15 minutes idle; use starter for a demo day.
    region: singapore
    dockerfilePath: ./applications/generic/temuriset/applications/temuriset-api/Dockerfile
    dockerContext: ./applications/generic/temuriset/applications/temuriset-api
    # No dockerCommand: the image's entrypoint runs `alembic upgrade head`, then uvicorn on $PORT.
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - applications/generic/temuriset/applications/temuriset-api/**
    envVars:
      - fromGroup: temuriset-shared

  - type: worker
    name: temuriset-worker
    runtime: docker
    plan: starter # Background workers have no free plan.
    region: singapore
    dockerfilePath: ./deployment/temuriset/render/worker.Dockerfile
    dockerContext: ./applications/generic/temuriset/applications/temuriset-api
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - applications/generic/temuriset/applications/temuriset-api/**
        - deployment/temuriset/render/**
    envVars:
      - fromGroup: temuriset-shared

  # ClamAV skipped for now (about USD 25/month). Without it uploads stay in quarantine;
  # everything else works. To add it later, add a pserv running docker.io/clamav/clamav:1.4
  # (plan: standard) and set CLAMAV_HOST on the API and worker to its host.

envVarGroups:
  - name: temuriset-shared
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: COMPOSITION
        value: generic-base
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DEPLOYMENT
        value: "true"
      - key: MAILBOX_ADAPTER
        value: disabled
      - key: FILE_SCANNER
        value: clamav
      - key: CLAMAV_PORT
        value: "3310"
      - key: STORAGE_ADAPTER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: temuriset-documents
      # Neon URL rewritten for asyncpg, e.g.
      # postgresql+asyncpg://USER:PASSWORD@ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?ssl=require
      - key: DATABASE_URL
        sync: false
      # The Vercel address, exactly, e.g. https://temuriset.vercel.app (no trailing slash).
      - key: WEB_ORIGIN
        sync: false
      # Cloudflare R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
