# Render Blueprint for TemuRiset's API (free plan). The web app runs on Vercel.
# Free setup: the worker runs inside the API container (api-with-worker.Dockerfile), because
# Render has no free background workers. Free instances sleep after 15 minutes idle.
# For a paid setup later: switch this service to the API Dockerfile and add a `worker`
# service (plan: starter) built from deployment/temuriset/render/worker.Dockerfile.
# ClamAV is skipped (about USD 25/month): uploads stay in quarantine until a ClamAV pserv
# (docker.io/clamav/clamav:1.4, plan: standard) is added and CLAMAV_HOST points at it.
# Secrets are marked `sync: false`: Render asks for them when you create the Blueprint.
services:
  - type: web
    name: temuriset-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deployment/temuriset/render/api-with-worker.Dockerfile
    dockerContext: ./applications/generic/temuriset/applications/temuriset-api
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - applications/generic/temuriset/applications/temuriset-api/**
        - deployment/temuriset/render/**
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: COMPOSITION
        value: generic-base
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DEPLOYMENT
        value: "true"
      - key: MAILBOX_ADAPTER
        value: disabled
      - key: FILE_SCANNER
        value: clamav
      - key: CLAMAV_PORT
        value: "3310"
      - key: STORAGE_ADAPTER
        value: s3
      - key: S3_BUCKET
        value: temuriset-documents
      # Neon direct (non-pooler) URL rewritten for asyncpg, e.g.
      # postgresql+asyncpg://USER:PASSWORD@ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?ssl=require
      - key: DATABASE_URL
        sync: false
      # The Vercel address, exactly, e.g. https://temuriset.vercel.app (no trailing slash).
      - key: WEB_ORIGIN
        sync: false
      # S3-compatible storage (Neon object storage, R2, ...): origin only, no path.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
