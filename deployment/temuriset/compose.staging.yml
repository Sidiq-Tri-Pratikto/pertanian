x-api-image: &api-image ${TEMURISET_API_IMAGE:?set the API image reference}
x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:?set the database URL}
  ENVIRONMENT: ${ENVIRONMENT:-staging}
  COMPOSITION: ${COMPOSITION:-generic-base}
  WEB_ORIGIN: ${WEB_ORIGIN:?set the public HTTPS origin}
  STORAGE_ADAPTER: s3
  S3_ENDPOINT_URL: http://object-store:8333
  S3_BUCKET: ${S3_BUCKET:-temuriset-documents}
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set bucket-scoped credentials}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set bucket-scoped credentials}
  FILE_SCANNER: clamav
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  MAILBOX_ADAPTER: ${MAILBOX_ADAPTER:-disabled}
x-labels: &release-labels
  org.opencontainers.image.revision: ${RELEASE_SHA:?set the release commit}
x-backend: &backend
  networks: [backend]
  labels: *release-labels
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    <<: *backend
    environment:
      POSTGRES_USER: temuriset
      POSTGRES_DB: temuriset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temuriset", "-d", "temuriset"]
      interval: 3s
      timeout: 3s
      retries: 30

  object-store:
    image: chrislusf/seaweedfs:latest@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    <<: *backend
    command:
      - mini
      - -dir=/data
      - -ip=object-store
      - -ip.bind=0.0.0.0
      - -s3.config=/run/temuriset/s3.json
      - -s3.autoCreateBucket=false
      - -bucket=${S3_BUCKET:-temuriset-documents}
    volumes:
      - objects:/data
      - type: bind
        source: ${S3_CONFIG_FILE:?set the object identity file path}
        target: /run/temuriset/s3.json
        read_only: true
        bind:
          create_host_path: false

  bucket-ready:
    image: *api-image
    <<: *backend
    entrypoint: ["python", "-m", "app.documents.storage_ready"]
    environment: *api-env
    depends_on:
      object-store:
        condition: service_started
    restart: "no"

  clamav:
    image: clamav/clamav-debian:1.4@sha256:ce80e97855d937e93009bb47eb5ecb410b514b844b03d0ecf00e8eeec92810cc
    <<: *backend
    networks: [backend, scanner-updates]
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}
    volumes:
      - signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 5s
      timeout: 5s
      retries: 36

  migrate:
    image: *api-image
    <<: *backend
    command: ["migrate"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: *api-image
    <<: *backend
    command: ["api"]
    environment: *api-env
    depends_on: &runtime-dependencies
      migrate:
        condition: service_completed_successfully
      bucket-ready:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24

  worker:
    image: *api-image
    <<: *backend
    command: ["worker"]
    environment: *api-env
    depends_on: *runtime-dependencies

  web:
    image: ${TEMURISET_WEB_IMAGE:?set the web image reference}
    <<: *backend
    networks: [backend, frontend]
    environment:
      API_URL: ${API_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy

  edge:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    labels: *release-labels
    security_opt: [no-new-privileges:true]
    networks: [frontend]
    depends_on: [web]
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${TLS_CERT_FILE:?set the TLS certificate path}
        target: /run/temuriset/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_FILE:?set the TLS key path}
        target: /run/temuriset/tls.key
        read_only: true
        bind:
          create_host_path: false

networks:
  backend:
    internal: true
  frontend:
  scanner-updates:

volumes:
  database:
  objects:
  signatures:
