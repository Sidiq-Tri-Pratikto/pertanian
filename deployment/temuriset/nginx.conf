# Docker DNS updates when Compose replaces the web container.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream temuriset_web {
    zone temuriset_web 64k;
    server web:3000 resolve;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/temuriset/tls.crt;
    ssl_certificate_key /run/temuriset/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;

    location / {
        proxy_pass http://temuriset_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
